function copy(t,m){const d=()=>toast(m);if(navigator.clipboard)navigator.clipboard.writeText(t).then(d);else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();d()}}
$('copySVG').onclick=()=>copy(svgStandalone(),'SVG скопирован ✓');
$('copyCSS').onclick=()=>copy(`.bg{position:fixed;inset:0;background:${state?state.bgBase:'#0a0a0a'} url("data:image/svg+xml,${encodeURIComponent(svgStandalone())}") center/cover no-repeat}`,'CSS скопирован ✓');
$('copyHTML').onclick=()=>copy(htmlStandalone(),'HTML скопирован ✓');
window.BGLAB_OK=1;
