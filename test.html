<script>
(function(){
var s=document.querySelector('.bg svg');if(!s)return;
var nodes=[].slice.call(s.querySelectorAll('[data-cfg]')).map(function(g){
  var c=JSON.parse(g.getAttribute('data-cfg'));
  return{c:c,h:s.querySelector('#'+c.cid+'h'),hi:s.querySelector('#'+c.cid+'hi'),ring:s.querySelector('#'+c.cid+'ring'),t:s.querySelector('#'+c.cid+'t')};});
if(!nodes.length)return;
addEventListener('pointermove',function(e){
  var m=s.getScreenCTM();if(!m)return;
  var p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(m.inverse());
  nodes.forEach(function(n){
    if(n.h){n.h.setAttribute('cx',p.x);n.h.setAttribute('cy',p.y)}
    if(n.hi){n.hi.setAttribute('cx',p.x);n.hi.setAttribute('cy',p.y)}
    if(n.ring){n.ring.setAttribute('cx',p.x);n.ring.setAttribute('cy',p.y)}
    if(n.t){var k=1+n.c.strength/100;n.t.setAttribute('transform','translate('+p.x+' '+p.y+') scale('+k+') translate('+(-p.x)+' '+(-p.y)+')')}
  });});
})();
</script>
